# SPDX-License-Identifier: AGPL-3.0-or-later
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-wordpress"
version = "0.0.1"
description = "Native NetBox source of truth for WordPress app config — wp-config constants, plugin/theme install-state, content-directory location + relocation intent, and per-site tuning"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Jameson" }]
keywords = ["netbox", "netbox-plugin", "wordpress", "wp-config", "cms", "php-fpm"]
# PEP 639: the SPDX `license` expression above is authoritative; a `License ::`
# classifier alongside it is rejected by setuptools>=77, so it is intentionally omitted.
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
]
dependencies = ["netbox-services", "netbox-database"]

[project.urls]
Repository = "https://github.com/JamesonRGrieve/netbox-wordpress"

[tool.setuptools.packages.find]
include = ["netbox_wordpress*"]

[tool.setuptools.package-data]
# The custom WordPressSite detail template must ship in the wheel (deploy is via
# non-editable wheels — memory: "NetBox plugin deploy = wheels").
netbox_wordpress = ["templates/**/*.html"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "netbox.settings"
python_files = ["test_*.py"]
addopts = "-v"
